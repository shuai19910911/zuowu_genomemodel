<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">CropGenome-FM research roadmap</title>
  <desc id="desc">Data curation, leakage-safe split, staged pretraining, downstream benchmark, and paper outputs for CropGenome-FM.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .header { fill: #0f172a; font: 700 30px Arial, sans-serif; }
      .sub { fill: #334155; font: 18px Arial, sans-serif; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .box2 { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 16; }
      .box3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 16; }
      .box4 { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 16; }
      .box5 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 16; }
      .txt { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .small { fill: #334155; font: 15px Arial, sans-serif; }
      .tiny { fill: #475569; font: 13px Arial, sans-serif; }
      .eval { fill: #7f1d1d; font: 700 14px Arial, sans-serif; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="60" y="58" class="header">CropGenome-FM 研究方案图</text>
  <text x="60" y="88" class="sub">作物结构注释基因组 → 防泄漏预训练 → 独立下游 benchmark（基准评测）→ 论文结论</text>

  <rect x="40" y="120" width="1320" height="720" class="panel"/>

  <rect x="80" y="170" width="220" height="135" class="box"/>
  <text x="105" y="205" class="txt">1. 数据口径</text>
  <text x="105" y="235" class="small">263 行 crop assembly</text>
  <text x="105" y="258" class="small">258 个 canonical accession</text>
  <text x="105" y="281" class="tiny">只用 genome + GFF/GTF</text>
  <text x="105" y="299" class="eval">评估: 少而干净，优先可靠标签</text>

  <rect x="355" y="170" width="230" height="135" class="box2"/>
  <text x="380" y="205" class="txt">2. QC 与区域构建</text>
  <text x="380" y="235" class="small">CDS / splice / UTR</text>
  <text x="380" y="258" class="small">promoter / TES / intron</text>
  <text x="380" y="281" class="tiny">TE/repeat 仅在证据可靠时启用</text>
  <text x="380" y="299" class="eval">评估: 不伪造结构标签</text>

  <rect x="640" y="170" width="230" height="135" class="box3"/>
  <text x="665" y="205" class="txt">3. 防泄漏 split</text>
  <text x="665" y="235" class="small">accession 级 train/val/test</text>
  <text x="665" y="258" class="small">192 / 35 / 31</text>
  <text x="665" y="281" class="tiny">先 split 后窗口化与采样</text>
  <text x="665" y="299" class="eval">评估: 降低近重复泄漏</text>

  <rect x="930" y="170" width="230" height="135" class="box5"/>
  <text x="955" y="205" class="txt">4. Stage 输入固化</text>
  <text x="955" y="235" class="small">Stage B: 8K, 41.24B token</text>
  <text x="955" y="258" class="small">C1/C2/D: 64K/128K/256K</text>
  <text x="955" y="281" class="tiny">mask/label/RC 训练时动态生成</text>
  <text x="955" y="299" class="eval">评估: 可复现且节省搬运</text>

  <path class="arrow" d="M 300 237 L 350 237"/>
  <path class="arrow" d="M 585 237 L 635 237"/>
  <path class="arrow" d="M 870 237 L 925 237"/>

  <rect x="170" y="390" width="255" height="150" class="box5"/>
  <text x="195" y="425" class="txt">5. v2 Stable 预训练</text>
  <text x="195" y="455" class="small">HyenaLite + local attention</text>
  <text x="195" y="478" class="small">MLM + 0.02 RC consistency</text>
  <text x="195" y="501" class="tiny">region head 只作弱监督/健康检查</text>
  <text x="195" y="522" class="eval">评估: 工程稳健，结论靠 benchmark</text>

  <rect x="525" y="390" width="255" height="150" class="box3"/>
  <text x="550" y="425" class="txt">6. 模型选择</text>
  <text x="550" y="455" class="small">selection loss = MLM + 0.02 RC</text>
  <text x="550" y="478" class="small">step1000 验证 / 保存</text>
  <text x="550" y="501" class="tiny">step5000 后 early stopping</text>
  <text x="550" y="522" class="eval">评估: 防止只看 final checkpoint</text>

  <rect x="880" y="390" width="290" height="150" class="box2"/>
  <text x="905" y="425" class="txt">7. 独立下游 benchmark</text>
  <text x="905" y="455" class="small">splice / promoter / TES / UTR</text>
  <text x="905" y="478" class="small">TIS/TTS / TE boundary / cross-species</text>
  <text x="905" y="501" class="tiny">基线: 1-mer, CNN, DNABERT-2, AgroNT 等</text>
  <text x="905" y="522" class="eval">评估: 正式结论只来自这里</text>

  <path class="arrow" d="M 1045 305 C 1045 350 298 350 298 385"/>
  <path class="arrow" d="M 425 465 L 520 465"/>
  <path class="arrow" d="M 780 465 L 875 465"/>

  <rect x="160" y="635" width="300" height="120" class="box"/>
  <text x="185" y="670" class="txt">消融与风险控制</text>
  <text x="185" y="700" class="small">no-region vs with-region</text>
  <text x="185" y="723" class="small">8K 完整上下文 vs 128 bp probe</text>
  <text x="185" y="744" class="eval">评估: 避免辅助标签虚高</text>

  <rect x="550" y="635" width="300" height="120" class="box4"/>
  <text x="575" y="670" class="txt">结构注释增强</text>
  <text x="575" y="700" class="small">EDTA/TE/repeat/telomere/centromere</text>
  <text x="575" y="723" class="small">证据不足则延后，不进入结论</text>
  <text x="575" y="744" class="eval">评估: 宁可少做，不做假标签</text>

  <rect x="940" y="635" width="300" height="120" class="box2"/>
  <text x="965" y="670" class="txt">论文输出</text>
  <text x="965" y="700" class="small">项目定位 + 数据严谨性</text>
  <text x="965" y="723" class="small">主结果 + 消融 + 跨物种迁移</text>
  <text x="965" y="744" class="eval">评估: 架构为稳健载体，结果是核心</text>

  <path class="dash" d="M 1025 540 C 1025 590 310 590 310 632"/>
  <path class="dash" d="M 1025 540 C 1025 590 700 590 700 632"/>
  <path class="arrow" d="M 1170 540 C 1240 575 1180 605 1090 632"/>

  <text x="60" y="875" class="tiny">注: 所有训练曲线、下游 probe 图和进展解释集中在 TRAINING_PROGRESS.md；本图只表达研究设计，不展示结果。</text>
</svg>
