<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">CropGenome-FM v2 Stable model architecture</title>
  <desc id="desc">Single-base crop genome model with embeddings, HyenaLite backbone, local attention, MLM head, RC consistency, region auxiliary head, and checkpoint selection.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 24; }
      .title { fill: #0f172a; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #334155; font: 18px Arial, sans-serif; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 16; }
      .orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 16; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 16; }
      .red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 16; }
      .gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 16; }
      .txt { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .small { fill: #334155; font: 15px Arial, sans-serif; }
      .tiny { fill: #475569; font: 13px Arial, sans-serif; }
      .eval { fill: #7f1d1d; font: 700 14px Arial, sans-serif; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1400" height="920"/>
  <text x="60" y="58" class="title">CropGenome-FM-v2-Stable-8K 模型架构图</text>
  <text x="60" y="88" class="subtitle">单碱基输入 + HyenaLite（轻量长卷积）+ local attention（局部注意力）+ MLM/RC 主选择指标</text>

  <rect x="40" y="120" width="1320" height="740" class="panel"/>

  <rect x="75" y="170" width="260" height="145" class="box"/>
  <text x="100" y="205" class="txt">输入窗口</text>
  <text x="100" y="235" class="small">input_ids: [B, 8192]</text>
  <text x="100" y="258" class="small">A/C/G/T/N/MASK/PAD</text>
  <text x="100" y="281" class="tiny">metadata: assembly, species, contig, start/end</text>
  <text x="100" y="301" class="eval">评估: 单碱基有利于变异解释</text>

  <rect x="405" y="170" width="260" height="145" class="green"/>
  <text x="430" y="205" class="txt">嵌入层</text>
  <text x="430" y="235" class="small">token embedding（碱基嵌入）</text>
  <text x="430" y="258" class="small">region / quality / position 信息</text>
  <text x="430" y="281" class="tiny">N/PAD 不进入主 MLM loss</text>
  <text x="430" y="301" class="eval">评估: 加入结构注释但不直接当结论</text>

  <rect x="735" y="170" width="300" height="145" class="purple"/>
  <text x="760" y="205" class="txt">32 层 HyenaLite 主干</text>
  <text x="760" y="235" class="small">d_model=1024, conv_kernel=127</text>
  <text x="760" y="258" class="small">long-convolution mixer（长卷积混合器）</text>
  <text x="760" y="281" class="tiny">gradient checkpointing（梯度检查点）节省显存</text>
  <text x="760" y="301" class="eval">评估: 稳定处理 8K，比全注意力省显存</text>

  <rect x="1090" y="170" width="220" height="145" class="orange"/>
  <text x="1115" y="205" class="txt">局部注意力</text>
  <text x="1115" y="235" class="small">every 4 layers</text>
  <text x="1115" y="258" class="small">8 heads, chunk=512</text>
  <text x="1115" y="281" class="tiny">补充局部精确相互作用</text>
  <text x="1115" y="301" class="eval">评估: 提升剪接/边界任务潜力</text>

  <path class="arrow" d="M 335 242 L 400 242"/>
  <path class="arrow" d="M 665 242 L 730 242"/>
  <path class="arrow" d="M 1035 242 L 1085 242"/>

  <rect x="190" y="410" width="270" height="150" class="green"/>
  <text x="215" y="445" class="txt">MLM head（遮盖预测头）</text>
  <text x="215" y="475" class="small">15% mask probability</text>
  <text x="215" y="498" class="small">预测被遮盖 A/C/G/T/N</text>
  <text x="215" y="521" class="tiny">主 loss weight = 1.0</text>
  <text x="215" y="542" class="eval">评估: 预训练主目标，最重要</text>

  <rect x="565" y="410" width="270" height="150" class="orange"/>
  <text x="590" y="445" class="txt">RC consistency（反向互补一致性）</text>
  <text x="590" y="475" class="small">weight = 0.02</text>
  <text x="590" y="498" class="small">forward/RC 表示方向一致</text>
  <text x="590" y="521" class="tiny">不把它夸大成唯一创新</text>
  <text x="590" y="542" class="eval">评估: 小权重约束，防止压过 MLM</text>

  <rect x="940" y="410" width="270" height="150" class="red"/>
  <text x="965" y="445" class="txt">Region auxiliary head（区域辅助头）</text>
  <text x="965" y="475" class="small">7 类区域: background/coding/...</text>
  <text x="965" y="498" class="small">weight = 0.05, smoothing=0.05</text>
  <text x="965" y="521" class="tiny">只作 weak supervision（弱监督）</text>
  <text x="965" y="542" class="eval">评估: 不能作为正式下游证据</text>

  <path class="thin" d="M 885 315 C 820 365 340 365 325 405"/>
  <path class="thin" d="M 885 315 C 840 365 700 365 700 405"/>
  <path class="thin" d="M 885 315 C 950 365 1075 365 1075 405"/>

  <rect x="190" y="650" width="315" height="135" class="gray"/>
  <text x="215" y="685" class="txt">训练选择指标</text>
  <text x="215" y="715" class="small">selection loss = MLM + 0.02 × RC</text>
  <text x="215" y="738" class="small">region loss 不参与 best checkpoint</text>
  <text x="215" y="761" class="eval">评估: 防止区域标签驱动虚高</text>

  <rect x="555" y="650" width="315" height="135" class="gray"/>
  <text x="580" y="685" class="txt">Checkpoint 与早停</text>
  <text x="580" y="715" class="small">save/eval every 1000 steps</text>
  <text x="580" y="738" class="small">early stop: min_steps=5000, patience=3</text>
  <text x="580" y="761" class="eval">评估: 用验证集控制训练长度</text>

  <rect x="920" y="650" width="315" height="135" class="gray"/>
  <text x="945" y="685" class="txt">下游接口</text>
  <text x="945" y="715" class="small">frozen embedding（冻结表示）/ fine-tune（微调）</text>
  <text x="945" y="738" class="small">per-base score（单碱基评分）/ sequence embedding</text>
  <text x="945" y="761" class="eval">评估: 正式价值由 benchmark 证明</text>

  <path class="arrow" d="M 325 560 L 325 645"/>
  <path class="arrow" d="M 700 560 L 700 645"/>
  <path class="arrow" d="M 1075 560 L 1075 645"/>

  <text x="60" y="895" class="tiny">边界: 当前 v2 Stable 可称 RC-aware/RC-consistency（反向互补感知/一致性）；是否宣称严格 RC-equivariant（反向互补等变）必须以后续代码审计和消融验证为准。</text>
</svg>
