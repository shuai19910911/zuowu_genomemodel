<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">CropGenome-FM model architecture</title>
  <desc id="desc">Detailed model-only architecture diagram for crop genome foundation model pretraining.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #253244; stroke-width: 3; }
      .subpanel { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .input { fill: #e0f2fe; stroke: #075985; stroke-width: 2.5; }
      .embed { fill: #dcfce7; stroke: #166534; stroke-width: 2.5; }
      .backbone { fill: #fef3c7; stroke: #92400e; stroke-width: 2.5; }
      .head { fill: #fce7f3; stroke: #9d174d; stroke-width: 2.5; }
      .stage { fill: #ede9fe; stroke: #5b21b6; stroke-width: 2.5; }
      .note { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; font-size: 30px; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; font-size: 24px; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; font-size: 20px; }
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; font-size: 52px; font-weight: 700; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; font-size: 27px; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; font-size: 28px; font-weight: 700; }
      .mono { font-family: Consolas, Menlo, monospace; fill: #0f172a; font-size: 23px; }
      .arrow { stroke: #334155; stroke-width: 5; fill: none; marker-end: url(#arrowHead); }
      .arrow2 { stroke: #7c3aed; stroke-width: 5; fill: none; marker-end: url(#arrowHeadPurple); }
      .dash { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
    </style>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#334155"/>
    </marker>
    <marker id="arrowHeadPurple" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="1700"/>

  <text class="title" x="120" y="90">CropGenome-FM 纯模型架构图</text>
  <text class="subtitle" x="120" y="132">同一个模型按 8K 到 64K 到 128K 到 256K 逐阶段继续训练，不是每个 context 单独从零训练一个模型</text>

  <rect class="panel" x="90" y="170" width="2220" height="1520" rx="12"/>

  <!-- Input side -->
  <rect class="input" x="140" y="230" width="430" height="270" rx="10"/>
  <text class="label" x="170" y="275">1. 在线采样窗口</text>
  <text class="small" x="170" y="320">来自候选池的高质量片段</text>
  <text class="tiny" x="170" y="360">context: 8K / 64K / 128K / 256K</text>
  <text class="tiny" x="170" y="398">区域: CDS, splice, TSS, UTR, intron</text>
  <text class="tiny" x="170" y="436">metadata: assembly, species, contig, strand</text>
  <text class="tiny" x="170" y="474">split: train / val / test 严格隔离</text>

  <rect class="input" x="140" y="550" width="430" height="260" rx="10"/>
  <text class="label" x="170" y="595">2. 单碱基 tokenization</text>
  <text class="mono" x="170" y="640">A=0 C=1 G=2 T=3 N=4</text>
  <text class="mono" x="170" y="678">MASK=5 PAD=6 BOS=7 EOS=8</text>
  <text class="tiny" x="170" y="723">mask span 按区域动态设置</text>
  <text class="tiny" x="170" y="760">N, PAD, 低质量位点不计 loss</text>

  <rect class="input" x="140" y="860" width="430" height="255" rx="10"/>
  <text class="label" x="170" y="905">3. RC 双链处理</text>
  <text class="tiny" x="170" y="950">forward 序列和 reverse-complement</text>
  <text class="tiny" x="170" y="988">共享参数编码</text>
  <text class="tiny" x="170" y="1026">训练时加入 RC consistency</text>
  <text class="tiny" x="170" y="1064">推理时可做双向平均或一致性打分</text>

  <!-- Embedding -->
  <rect class="embed" x="690" y="250" width="470" height="410" rx="10"/>
  <text class="label" x="725" y="300">4. 输入 embedding 融合</text>
  <text class="tiny" x="725" y="350">token embedding: 单碱基词表</text>
  <text class="tiny" x="725" y="390">region embedding: CDS / splice / TSS / UTR</text>
  <text class="tiny" x="725" y="430">strand embedding: plus / minus / unknown</text>
  <text class="tiny" x="725" y="470">quality embedding: N 比例, 低复杂度, rescue</text>
  <text class="tiny" x="725" y="510">species or genus embedding: 可选</text>
  <text class="tiny" x="725" y="550">position scheme: 长上下文相对位置或卷积状态</text>
  <text class="mono" x="725" y="610">x0 = Etok + Eregion + Estrand + Equal</text>

  <rect class="embed" x="690" y="730" width="470" height="290" rx="10"/>
  <text class="label" x="725" y="780">5. 训练标记张量</text>
  <text class="mono" x="725" y="830">input_ids, labels_mlm</text>
  <text class="mono" x="725" y="868">loss_mask, region_ids</text>
  <text class="mono" x="725" y="906">region_weights, rc_flag</text>
  <text class="tiny" x="725" y="960">batch 内按目标区域比例动态采样</text>

  <!-- Backbone -->
  <rect class="backbone" x="1270" y="210" width="620" height="835" rx="12"/>
  <text class="label" x="1310" y="260">6. 长上下文 backbone</text>
  <text class="subtitle" x="1310" y="305">RC-equivariant bidirectional Mamba2 / Hyena</text>

  <rect class="subpanel" x="1320" y="350" width="520" height="115" rx="8"/>
  <text class="small" x="1350" y="393">Block 1: local convolution / SSM mixer</text>
  <text class="tiny" x="1350" y="432">捕获 motif, codon, splice dinucleotide</text>

  <rect class="subpanel" x="1320" y="495" width="520" height="115" rx="8"/>
  <text class="small" x="1350" y="538">Block 2: bidirectional sequence mixing</text>
  <text class="tiny" x="1350" y="577">forward 和 reverse-complement 参数约束</text>

  <rect class="subpanel" x="1320" y="640" width="520" height="115" rx="8"/>
  <text class="small" x="1350" y="683">Periodic global attention</text>
  <text class="tiny" x="1350" y="722">每 4 到 6 层插入一次，补充长程依赖</text>

  <rect class="subpanel" x="1320" y="785" width="520" height="115" rx="8"/>
  <text class="small" x="1350" y="828">FFN / gated MLP + norm + residual</text>
  <text class="tiny" x="1350" y="867">bf16, activation checkpointing, ZeRO-3 或 FSDP</text>

  <text class="tiny" x="1310" y="950">Large 目标: 300M 到 450M 参数</text>
  <text class="tiny" x="1310" y="990">32 layers, hidden 1024, attention sparse periodic</text>

  <!-- Outputs -->
  <rect class="head" x="2020" y="250" width="250" height="185" rx="10"/>
  <text class="label" x="2045" y="300">MLM head</text>
  <text class="tiny" x="2045" y="345">区域加权 masked LM</text>
  <text class="tiny" x="2045" y="382">主要预训练目标</text>

  <rect class="head" x="2020" y="485" width="250" height="185" rx="10"/>
  <text class="label" x="2045" y="535">Causal head</text>
  <text class="tiny" x="2045" y="580">next-token 辅助 loss</text>
  <text class="tiny" x="2045" y="617">用于变异 likelihood</text>

  <rect class="head" x="2020" y="720" width="250" height="185" rx="10"/>
  <text class="label" x="2045" y="770">RC head</text>
  <text class="tiny" x="2045" y="815">双链一致性约束</text>
  <text class="tiny" x="2045" y="852">降低方向偏置</text>

  <rect class="head" x="2020" y="955" width="250" height="185" rx="10"/>
  <text class="label" x="2045" y="1005">Region probe</text>
  <text class="tiny" x="2045" y="1050">可选对比学习</text>
  <text class="tiny" x="2045" y="1087">辅助区域表征</text>

  <!-- Loss -->
  <rect class="note" x="690" y="1100" width="1200" height="210" rx="10"/>
  <text class="label" x="725" y="1150">7. 总损失</text>
  <text class="mono" x="725" y="1205">L = 1.00 * L_region_weighted_MLM</text>
  <text class="mono" x="765" y="1243">+ 0.10 * L_causal_next_token</text>
  <text class="mono" x="765" y="1281">+ 0.05 * L_reverse_complement_consistency</text>

  <!-- Curriculum -->
  <rect class="stage" x="140" y="1345" width="2130" height="265" rx="12"/>
  <text class="label" x="180" y="1395">8. Context curriculum: 同一模型连续训练</text>
  <rect class="subpanel" x="180" y="1430" width="475" height="145" rx="8"/>
  <text class="small" x="210" y="1472">Stage B: 8K</text>
  <text class="tiny" x="210" y="1512">30B 到 80B tokens</text>
  <text class="tiny" x="210" y="1548">局部 motif, CDS, splice, TSS/TES</text>

  <rect class="subpanel" x="705" y="1430" width="475" height="145" rx="8"/>
  <text class="small" x="735" y="1472">Stage C1: 64K</text>
  <text class="tiny" x="735" y="1512">从 Stage B checkpoint 继续训练</text>
  <text class="tiny" x="735" y="1548">gene body, promoter-gene, long intron</text>

  <rect class="subpanel" x="1230" y="1430" width="475" height="145" rx="8"/>
  <text class="small" x="1260" y="1472">Stage C2: 128K</text>
  <text class="tiny" x="1260" y="1512">从 C1 checkpoint 继续训练</text>
  <text class="tiny" x="1260" y="1548">远端调控和结构上下文</text>

  <rect class="subpanel" x="1755" y="1430" width="475" height="145" rx="8"/>
  <text class="small" x="1785" y="1472">Stage D: 256K</text>
  <text class="tiny" x="1785" y="1512">资源允许后 midtraining</text>
  <text class="tiny" x="1785" y="1548">长上下文推理和远端候选排序</text>

  <!-- Arrows -->
  <path class="arrow" d="M570 365 C610 365, 640 365, 685 405"/>
  <path class="arrow" d="M570 680 C625 680, 650 680, 685 760"/>
  <path class="arrow" d="M570 990 C645 990, 650 940, 685 910"/>
  <path class="arrow" d="M1160 455 C1205 455, 1225 455, 1265 455"/>
  <path class="arrow" d="M1160 880 C1205 880, 1225 795, 1265 735"/>
  <path class="arrow" d="M1890 410 C1950 410, 1970 345, 2015 345"/>
  <path class="arrow" d="M1890 545 C1950 545, 1970 580, 2015 580"/>
  <path class="arrow" d="M1890 725 C1950 725, 1970 815, 2015 815"/>
  <path class="arrow" d="M1890 875 C1950 875, 1970 1045, 2015 1045"/>
  <path class="arrow" d="M655 1502 C675 1502, 685 1502, 700 1502"/>
  <path class="arrow" d="M1180 1502 C1200 1502, 1210 1502, 1225 1502"/>
  <path class="arrow" d="M1705 1502 C1725 1502, 1735 1502, 1750 1502"/>
  <path class="arrow2" d="M1580 1045 C1580 1080, 1580 1085, 1580 1095"/>
  <path class="dash" d="M925 1020 C925 1060, 970 1075, 1120 1095"/>
  <path class="dash" d="M2145 1140 C2145 1240, 1950 1280, 1895 1280"/>
</svg>
